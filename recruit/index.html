<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>参画希望の学生へ（メンバー募集） | Litelligence</title>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body class="bg-gray-50 font-sans text-gray-900">

        <!-- ヘッダー -->
        <header class="w-full bg-white shadow-sm border-b border-gray-100 relative z-50">
            <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between items-center h-16">
                    <!-- 左側：ロゴ部分 -->
                    <a href="https://litelligence.net" class="flex items-baseline no-underline">
                        <span class="font-black text-2xl tracking-tight text-gray-900">
                            Litelligence 
                            <span class="text-blue-600 text-sm font-bold ml-2">情報科教育推進チーム</span>
                        </span>
                    </a>
                    
                    <!-- 右側：ナビゲーションメニュー (PC表示時) -->
                    <nav class="hidden md:flex space-x-6 items-center">
                        <a href="https://litelligence.net/techinfo" class="text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-full transition no-underline">
                            特設サイトに戻る
                        </a>
                    </nav>
                </div>
            </div>
        </header>

        <!-- フォームセクション -->
        <main class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
            <div class="bg-white rounded-xl shadow-md p-8 sm:p-12">
                <div class="text-center mb-10">
                    <span class="text-blue-600 font-bold tracking-wider text-sm uppercase">Recruit</span>
                    <h1 class="text-3xl font-bold text-gray-900 mt-2 mb-4">メンバー応募フォーム</h1>
                    <p class="text-gray-600">教育現場に新しい価値を提供したい、アプリ開発の経験を活かしたい学生のエントリーをお待ちしています。</p>
                </div>

                <!-- formのaction属性にFormspreeなどのエンドポイントURLを指定します -->
                <form id="contactForm" action="https://formspree.io/f/moejgrrp" method="POST" class="space-y-6">
                    <div class="grid grid-cols-1 gap-6 sm:grid-cols-2">
                        <div>
                            <label for="lastName" class="block text-sm font-medium text-gray-700">姓 <span class="text-red-500">*</span></label>
                            <input type="text" id="lastName" name="lastName" required class="mt-1 w-full border border-gray-300 rounded-md shadow-sm px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        <div>
                            <label for="firstName" class="block text-sm font-medium text-gray-700">名 <span class="text-red-500">*</span></label>
                            <input type="text" id="firstName" name="firstName" required class="mt-1 w-full border border-gray-300 rounded-md shadow-sm px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                        </div>
                    </div>

                    <div>
                        <label for="school" class="block text-sm font-medium text-gray-700">学校名・学部・学年 <span class="text-red-500">*</span></label>
                        <input type="text" id="school" name="school" placeholder="例: ○○大学 理工学部 2年" required class="mt-1 w-full border border-gray-300 rounded-md shadow-sm px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>

                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700">メールアドレス <span class="text-red-500">*</span></label>
                        <input type="email" id="email" name="email" required class="mt-1 w-full border border-gray-300 rounded-md shadow-sm px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>

                    <div>
                        <label for="role" class="block text-sm font-medium text-gray-700">希望する役割（複数可） <span class="text-red-500">*</span></label>
                        <div class="mt-2 space-y-2">
                            <label class="inline-flex items-center">
                                <input type="checkbox" name="role[]" value="ファシリテーター" class="rounded border-gray-300 text-blue-600 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                                <span class="ml-2 text-gray-700">授業ファシリテーター・講師</span>
                            </label><br>
                            <label class="inline-flex items-center">
                                <input type="checkbox" name="role[]" value="エンジニア" class="rounded border-gray-300 text-blue-600 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                                <span class="ml-2 text-gray-700">アプリ・Web開発（エンジニア）</span>
                            </label><br>
                            <label class="inline-flex items-center">
                                <input type="checkbox" name="role[]" value="広報・企画" class="rounded border-gray-300 text-blue-600 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                                <span class="ml-2 text-gray-700">広報・授業企画・デザイン</span>
                            </label>
                        </div>
                    </div>

                    <div>
                        <label for="motivation" class="block text-sm font-medium text-gray-700">志望動機・自己アピール <span class="text-red-500">*</span></label>
                        <textarea id="motivation" name="motivation" rows="4" placeholder="IT教育への思いや、これまでの経験（開発経験など）について自由に書いてください。" required class="mt-1 w-full border border-gray-300 rounded-md shadow-sm px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"></textarea>
                    </div>

                    <div>
                        <label for="portfolio" class="block text-sm font-medium text-gray-700">ポートフォリオ・GitHubなど（任意）</label>
                        <input type="url" id="portfolio" name="portfolio" placeholder="https://" class="mt-1 w-full border border-gray-300 rounded-md shadow-sm px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>

                    <div class="pt-4">
                        <button type="submit" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-sm font-bold text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition">
                            送信する
                        </button>
                    </div>
                </form>

                <div id="successMessage" class="hidden text-center py-12">
                    <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-green-100 text-green-600 mb-6">
                        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                    </div>
                    <h2 class="text-2xl font-bold text-gray-900 mb-2">送信が完了しました</h2>
                    <p class="text-gray-600 mb-8">お問い合わせありがとうございます。内容を確認次第、担当者よりご連絡いたします。</p>
                    <a href="https://litelligence.net/techinfo" class="text-blue-600 font-medium hover:underline">トップページへ戻る</a>
                </div>
            </div>
        </main>

        <!-- フッター -->
        <footer class="bg-gray-900 py-8 mt-auto">
            <div class="max-w-6xl mx-auto px-4 text-center text-gray-400 text-sm">
                &copy; 2026 Litelligence. All rights reserved.
            </div>
        </footer>
    </body>
</html>

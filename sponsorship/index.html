<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>企業・協賛希望の皆様へ | Litelligence</title>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body class="bg-gray-50 font-sans text-gray-900">

        <!-- ヘッダー -->
        <header class="w-full bg-white shadow-sm border-b border-gray-100 relative z-50">
            <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between items-center h-16">
                    <!-- 左側：ロゴ部分 -->
                    <a href="https://litelligence.net" class="flex items-baseline no-underline">
                        <span class="font-black text-2xl tracking-tight text-gray-900">
                            Litelligence 
                            <span class="text-blue-600 text-sm font-bold ml-2">情報科教育推進チーム</span>
                        </span>
                    </a>
                    
                    <!-- 右側：ナビゲーションメニュー (PC表示時) -->
                    <nav class="hidden md:flex space-x-6 items-center">
                        <a href="https://litelligence.net/techinfo" class="text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-full transition no-underline">
                            特設サイトに戻る
                        </a>
                    </nav>
                </div>
            </div>
        </header>
        <!-- フォームセクション -->
        <main class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
            <div class="bg-white rounded-xl shadow-md p-8 sm:p-12">
                <div class="text-center mb-10">
                    <h1 class="text-3xl font-bold text-gray-900 mb-4">企業・協賛・学校関係者様 お問い合わせ</h1>
                    <p class="text-gray-600">授業の導入に関するご相談や、当団体の活動への協賛に関するお問い合わせはこちらからお願いいたします。</p>
                </div>

                <!-- formのaction属性にFormspreeなどのエンドポイントURLを指定します -->
                <form id="contactForm" action="https://formspree.io/f/xoejgryp" method="POST" class="space-y-6">
                    <div>
                        <label for="organization" class="block text-sm font-medium text-gray-700">貴社名・学校名 <span class="text-red-500">*</span></label>
                        <input type="text" id="organization" name="organization" required class="mt-1 w-full border border-gray-300 rounded-md shadow-sm px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    
                    <div>
                        <label for="name" class="block text-sm font-medium text-gray-700">ご担当者様氏名 <span class="text-red-500">*</span></label>
                        <input type="text" id="name" name="name" required class="mt-1 w-full border border-gray-300 rounded-md shadow-sm px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>

                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700">メールアドレス <span class="text-red-500">*</span></label>
                        <input type="email" id="email" name="email" required class="mt-1 w-full border border-gray-300 rounded-md shadow-sm px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>

                    <div>
                        <label for="type" class="block text-sm font-medium text-gray-700">お問い合わせ種別 <span class="text-red-500">*</span></label>
                        <select id="type" name="type" required class="mt-1 w-full border border-gray-300 rounded-md shadow-sm px-4 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                            <option value="">選択してください</option>
                            <option value="授業実施のご相談">授業実施のご相談</option>
                            <option value="協賛・パートナーシップについて">協賛・パートナーシップについて</option>
                            <option value="取材等のご依頼">取材等のご依頼</option>
                            <option value="その他">その他</option>
                        </select>
                    </div>

                    <div>
                        <label for="message" class="block text-sm font-medium text-gray-700">お問い合わせ内容 <span class="text-red-500">*</span></label>
                        <textarea id="message" name="message" rows="5" required class="mt-1 w-full border border-gray-300 rounded-md shadow-sm px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"></textarea>
                    </div>

                    <div class="pt-4">
                        <button type="submit" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-sm font-bold text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition">
                            送信する
                        </button>
                    </div>
                </form>

                <div id="successMessage" class="hidden text-center py-12">
                    <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-green-100 text-green-600 mb-6">
                        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                    </div>
                    <h2 class="text-2xl font-bold text-gray-900 mb-2">送信が完了しました</h2>
                    <p class="text-gray-600 mb-8">お問い合わせありがとうございます。内容を確認次第、担当者よりご連絡いたします。</p>
                    <a href="https://litelligence.net/techinfo" class="text-blue-600 font-medium hover:underline">トップページへ戻る</a>
                </div>
                
            </div>
        </main>

        <!-- フッター -->
        <footer class="bg-gray-900 py-8 mt-auto">
            <div class="max-w-6xl mx-auto px-4 text-center text-gray-400 text-sm">
                &copy; 2026 Litelligence. All rights reserved.
            </div>
        </footer>
    </body>
</html>
